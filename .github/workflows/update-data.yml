name: Update data

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 1 * * 1"    # every Monday ~04:17 Cairo time

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Egyptian league - pull players and build grids
        run: python scraper/build_data.py --league egypt

      - name: Save Egyptian league data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Egyptian league data"
            git push
          fi

      - name: Premier League - pull players and build grids
        timeout-minutes: 180
        run: python scraper/build_data.py --league epl

      - name: Save Premier League data
        if: always()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Premier League data"
            git push
          fi
